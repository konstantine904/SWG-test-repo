name: project-kamino

services:
  aotc:
    image: project-kamino/aotc-core3:2.0
    build:
      context: ./docker
    container_name: project-kamino-aotc
    hostname: project-kamino
    env_file:
      - .env.example
      - path: .env
        required: false
    ports:
      - "${STATUS_PORT:-44455}:44455/tcp"
      - "${LOGIN_PORT:-44453}:44453/udp"
      - "${PING_PORT:-44462}:44462/udp"
      - "${ZONE_PORT:-44463}:44463/udp"
    volumes:
      - aotc-home:/home/swgemu
      - mariadb-data:/var/lib/mysql
      - shared-tre:/tre:ro
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /home/swgemu/.env && test -f /home/swgemu/workspace/Core3/MMOCoreORB/bin/conf/config-local.lua"]
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 90s

volumes:
  aotc-home:
    name: project-kamino-home
  mariadb-data:
    name: project-kamino-mariadb
  shared-tre:
    name: project-kamino-tre
    external: true
